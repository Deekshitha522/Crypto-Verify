
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Generated</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

<div class="login-card">

<h1>✅ Certificate Generated</h1>

<p><strong>Certificate ID:</strong> {{ certificate_id }}</p>

<br>

<p><strong>Name:</strong> {{ student_name }}</p>

<p><strong>USN:</strong> {{ usn }}</p>

<p><strong>Course:</strong> {{ course }}</p>

<p><strong>CGPA:</strong> {{ cgpa }}</p>

<p><strong>Issue Date:</strong> {{ issue_date }}</p>

<br>

<p style="word-break:break-all;font-size:12px;">
<strong>RSA Digital Signature</strong><br>
{{ signature[:120] }}...
</p>

<br>

<a href="/download/{{ certificate_id }}">
<button>⬇ Download Certificate (PDF)</button>
</a>

<br><br>

<a href="/issued">
<button>📋 View Issued Certificates</button>
</a>

<br><br>

<a href="/dashboard">
<button>🏠 Back to Dashboard</button>
</a>

</div>

</div>

</body>
</html>
